name: palay_detector_v3
description: Palay harvest ripeness detector — 4-tab app with Supabase history.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.0.8
  image: ^4.1.7

  # Supabase
  supabase_flutter: ^2.0.0

  # File paths
  path_provider: ^2.1.2
  path: ^1.8.3

  # Settings persistence
  shared_preferences: ^2.2.2

  # State management
  provider: ^6.1.2

  # Date formatting
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true